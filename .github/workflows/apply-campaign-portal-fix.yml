name: Apply campaign portal fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch campaign portal safety and draft visibility
        run: |
          python - <<'PY'
          from pathlib import Path

          detail = Path('src/pages/CampaignDetail.jsx')
          text = detail.read_text()
          old = """      // Campaign not found or RLS blocked — do not expose whether it exists for another player\n      if (campRes.error || !campRes.data) {\n        navigate('/campaigns', { replace: true })\n        return\n      }\n\n      const campaign = Array.isArray(campRes.data) ? campRes.data[0] : campRes.data\n"""
          new = """      // Campaign not found, RLS blocked, or RPC returned an empty array.\n      // Never render with an undefined campaign object.\n      const campaign = Array.isArray(campRes.data) ? campRes.data[0] : campRes.data\n      if (campRes.error || !campaign) {\n        navigate('/campaigns', { replace: true })\n        return\n      }\n"""
          if old not in text:
              raise SystemExit('CampaignDetail patch target not found')
          detail.write_text(text.replace(old, new, 1))

          dashboard = Path('src/pages/Dashboard.jsx')
          text = dashboard.read_text()
          old = """        .select('id, campaign_name, status, start_date, end_date, is_multi_level, offer_desc, campaign_type')\n        .order('created_at', { ascending: false })\n"""
          new = """        .select('id, campaign_name, status, start_date, end_date, is_multi_level, offer_desc, campaign_type')\n        .in('status', ['active', 'upcoming', 'ended', 'paused'])\n        .order('created_at', { ascending: false })\n"""
          if old not in text:
              raise SystemExit('Dashboard patch target not found')
          dashboard.write_text(text.replace(old, new, 1))

          campaigns = Path('src/pages/Campaigns.jsx')
          text = campaigns.read_text()
          old = """        .select(CAMPAIGN_SELECT)\n        .order('created_at', { ascending: false })\n"""
          new = """        .select(CAMPAIGN_SELECT)\n        .in('status', ['active', 'upcoming', 'ended', 'paused'])\n        .order('created_at', { ascending: false })\n"""
          if old not in text:
              raise SystemExit('Campaigns patch target not found')
          campaigns.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: node --test campaign-detail-regression.test.mjs reward-regression.test.mjs password-reset-regression.test.mjs portal-security-regression.test.mjs

      - name: Build portal
        run: npm run build

      - name: Commit verified patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-campaign-portal-fix.yml
          git add src/pages/CampaignDetail.jsx src/pages/Dashboard.jsx src/pages/Campaigns.jsx .github/workflows/apply-campaign-portal-fix.yml
          git commit -m 'fix: prevent campaign detail crash and hide drafts from player portal'
          git push
