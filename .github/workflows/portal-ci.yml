name: Portal CI

on:
  push:
    branches:
      - main
      - feature/portal-p0-final
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: node --test portal-security-regression.test.mjs password-reset-regression.test.mjs leaderboard.test.mjs leaderboard-page-regression.test.mjs leaderboard-route-regression.test.mjs campaign-detail-leaderboard-regression.test.mjs

      - name: Build production bundle
        run: npm run build
