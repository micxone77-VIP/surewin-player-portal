name: Apply reward P0 patch

on:
  push:
    branches:
      - feature/campaign-portal-p0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch reward RPC calls
        run: python scripts/patch-reward-p0.py

      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Rewards.jsx
          git rm .github/workflows/apply-reward-p0.yml scripts/patch-reward-p0.py
          git commit -m "fix: scope reward RPCs by campaign"
          git push origin HEAD:feature/campaign-portal-p0
