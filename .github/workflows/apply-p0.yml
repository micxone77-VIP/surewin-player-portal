name: Apply P0 portal patch

on:
  push:
    branches: [feature/campaign-portal-p0]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch campaign detail RPC access
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/CampaignDetail.jsx')
          s = p.read_text(encoding='utf-8')
          old = """      const [campRes, levelsRes, progRes] = await Promise.all([\n        supabase.from('campaigns').select(CAMPAIGN_SELECT).eq('id', id).single(),\n        supabase.rpc('get_my_campaign_levels', { p_campaign_id: id }),\n        supabase.rpc('get_my_campaign_progress', { p_campaign_id: id }),\n      ])"""
          new = """      const [campRes, levelsRes, progRes] = await Promise.all([\n        supabase.rpc('get_portal_campaign', { p_campaign_id: id }),\n        supabase.rpc('get_portal_campaign_levels', { p_campaign_id: id }),\n        supabase.rpc('get_my_campaign_progress', { p_campaign_id: id }),\n      ])"""
          if old not in s:
              raise SystemExit('Expected CampaignDetail query block was not found')
          s = s.replace(old, new, 1)
          old2 = """      const campaign = campRes.data\n      const levels   = levelsRes.data ?? []"""
          new2 = """      const campaign = Array.isArray(campRes.data) ? campRes.data[0] : campRes.data\n      const levels   = levelsRes.data ?? []"""
          if old2 not in s:
              raise SystemExit('Expected campaign assignment was not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CampaignDetail.jsx
          git rm .github/workflows/apply-p0.yml
          git commit -m "fix: use player-safe campaign detail RPCs"
          git push origin HEAD:feature/campaign-portal-p0
