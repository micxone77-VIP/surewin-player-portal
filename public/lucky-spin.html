<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SureWin Lucky Spin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy:    #0a1628;
  --orange:  #FF6B00;
  --orange2: #FF8C00;
  --gold:    #FFD700;
  --cyan:    #00d4ff;
  --white:   #ffffff;
  --card:    #0f2035;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #050e1e;
  color: #fff;
  font-family: 'Segoe UI', -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* ── Stars background ─────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(255,107,0,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(0,212,255,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(10,22,40,1) 0%, #050e1e 100%);
  pointer-events: none;
  z-index: 0;
}
body > * { position: relative; z-index: 1; }

/* ── Particle canvas ────────────────────────────── */
#bg-canvas, #confetti-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
#bg-canvas { z-index: 0; }
#confetti-canvas { z-index: 200; display: none; }

/* ── Language Bar ──────────────────────────────── */
#lang-bar {
  width: 100%;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  background: rgba(10,22,40,0.8);
  border-bottom: 1px solid rgba(255,107,0,0.2);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 50;
}
.lang-btn {
  padding: 4px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,107,0,0.3);
  background: transparent;
  color: #aaa;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: all .2s;
}
.lang-btn.active, .lang-btn:hover {
  background: linear-gradient(135deg, var(--orange), var(--orange2));
  color: #fff;
  border-color: var(--orange);
  box-shadow: 0 0 12px rgba(255,107,0,0.4);
}
#back-link {
  margin-right: auto;
  color: #667;
  font-size: 12px;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: color .2s;
}
#back-link:hover { color: var(--orange); }

/* ── Header ────────────────────────────────────── */
#header {
  text-align: center;
  padding: 28px 20px 4px;
  position: relative;
}
#header-badge {
  display: inline-block;
  background: linear-gradient(135deg, var(--orange), #cc4400);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 3px;
  padding: 4px 14px;
  border-radius: 20px;
  text-transform: uppercase;
  margin-bottom: 10px;
  box-shadow: 0 0 20px rgba(255,107,0,0.5);
}
#campaign-name {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: linear-gradient(135deg, #FFD700 0%, #FF8C00 40%, #FF3838 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 20px rgba(255,180,0,0.4));
  line-height: 1.1;
}
#campaign-subtitle {
  font-size: 13px;
  color: #778;
  margin-top: 6px;
  letter-spacing: 1px;
}

/* ── Main ───────────────────────────────────────── */
#main {
  width: 100%;
  max-width: 480px;
  padding: 16px 16px 30px;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

/* ── Wheel Container ────────────────────────────── */
#wheel-wrap {
  position: relative;
  width: 340px;
  height: 340px;
  flex-shrink: 0;
  margin: 10px auto 4px;
}

/* Outer glow ring */
#wheel-glow {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(255,107,0,0.25) 0%, transparent 70%);
  animation: pulseGlow 2s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.04); }
}

/* Decorative ring (light bulbs) */
#wheel-rim {
  position: absolute;
  inset: -14px;
  border-radius: 50%;
}
.rim-light {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform-origin: 0 0;
  animation: rimPulse 1.2s ease-in-out infinite;
}
@keyframes rimPulse {
  0%, 100% { opacity: 0.5; transform: translate(-50%,-50%) scale(0.8); }
  50% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
}

/* Canvas */
#wheel-canvas {
  width: 340px;
  height: 340px;
  border-radius: 50%;
  display: block;
  filter: drop-shadow(0 0 30px rgba(255,107,0,0.35));
}

/* Pointer */
#wheel-pointer {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  filter: drop-shadow(0 4px 10px rgba(255,107,0,1));
}
#wheel-pointer svg { display: block; }

/* Center button */
#wheel-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff 0%, #FFD700 40%, #FF8C00 75%, #cc4400 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 13px;
  color: var(--navy);
  cursor: pointer;
  box-shadow:
    0 0 0 4px rgba(255,215,0,0.5),
    0 0 0 8px rgba(255,107,0,0.2),
    0 4px 20px rgba(255,180,0,0.8),
    inset 0 2px 4px rgba(255,255,255,0.6);
  z-index: 10;
  letter-spacing: 1px;
  user-select: none;
  transition: transform .15s, box-shadow .15s;
}
#wheel-center:hover {
  transform: translate(-50%,-50%) scale(1.08);
  box-shadow:
    0 0 0 4px rgba(255,215,0,0.8),
    0 0 0 10px rgba(255,107,0,0.3),
    0 6px 30px rgba(255,180,0,1),
    inset 0 2px 4px rgba(255,255,255,0.6);
}
#wheel-center:active { transform: translate(-50%,-50%) scale(0.96); }

/* ── Card ──────────────────────────────────────── */
.sw-card {
  width: 100%;
  background: linear-gradient(145deg, #0f2240 0%, #0a1830 100%);
  border: 1px solid rgba(255,107,0,0.2);
  border-radius: 16px;
  padding: 18px;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

/* ── Player Bar ─────────────────────────────────── */
#player-bar {
  display: none;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, rgba(255,107,0,0.12), rgba(255,140,0,0.06));
  border: 1px solid rgba(255,107,0,0.3);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
}
#player-bar.show { display: flex; }
#player-icon {
  width: 34px;
  height: 34px;
  background: linear-gradient(135deg, var(--orange), var(--orange2));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  margin-right: 10px;
  flex-shrink: 0;
}
#player-name-display {
  color: var(--gold);
  font-weight: 800;
  font-size: 15px;
}
#player-info { display: flex; align-items: center; gap: 0; flex: 1; }
#logout-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.15);
  color: #778;
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
#logout-btn:hover { color: #ff6060; border-color: #ff6060; }

/* ── Status Message ─────────────────────────────── */
#status-msg {
  font-size: 13px;
  text-align: center;
  padding: 10px 16px;
  border-radius: 10px;
  display: none;
  width: 100%;
}
#status-msg.error   { background: rgba(220,50,50,.15);  color: #ff7070; border: 1px solid rgba(220,50,50,.3);  display: block; }
#status-msg.success { background: rgba(0,200,100,.1);   color: #50e090; border: 1px solid rgba(0,200,100,.25); display: block; }
#status-msg.info    { background: rgba(0,180,255,.1);   color: #60d0ff; border: 1px solid rgba(0,180,255,.25); display: block; }

/* ── Login Form ─────────────────────────────────── */
#login-form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.form-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: #556;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.sw-input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 10px;
  border: 1.5px solid rgba(255,107,0,0.15);
  background: rgba(255,255,255,0.04);
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.sw-input:focus {
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(255,107,0,0.15);
}
.sw-input::placeholder { color: #345; }
.sw-btn {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #FF6B00 0%, #FF8C00 50%, #FF3800 100%);
  color: #fff;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: opacity .2s, transform .1s;
  box-shadow:
    0 6px 20px rgba(255,107,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.2);
  position: relative;
  overflow: hidden;
}
.sw-btn::after {
  content: '';
  position: absolute;
  top: 0; left: -100%; width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  animation: shimmer 2.5s infinite;
}
@keyframes shimmer { 0% { left: -100%; } 100% { left: 200%; } }
.sw-btn:hover { opacity: .92; transform: translateY(-1px); }
.sw-btn:active { transform: scale(.98); }
.sw-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.sw-btn:disabled::after { display: none; }

/* ── History ────────────────────────────────────── */
#history-section { width: 100%; display: none; }
#history-section.show { display: block; }
#history-title {
  font-size: 11px;
  color: #556;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
#history-title::before, #history-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,107,0,0.15);
}
.history-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,107,0,0.12);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.history-prize { font-weight: 700; color: var(--gold); font-size: 14px; }
.history-date { color: #556; font-size: 11px; margin-top: 2px; }
.history-status {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  flex-shrink: 0;
  margin-left: 8px;
}
.status-pending    { background: rgba(255,180,0,.15); color: #ffcc44; }
.status-processing { background: rgba(0,180,255,.15); color: #60d0ff; }
.status-completed  { background: rgba(0,200,100,.15); color: #50e090; }
.status-cancelled  { background: rgba(200,50,50,.15); color: #ff7070; }

/* ── Prize Popup ────────────────────────────────── */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}
#overlay.show { display: flex; }
#popup {
  background: linear-gradient(145deg, #0f2240 0%, #071525 100%);
  border: 2px solid transparent;
  background-clip: padding-box;
  border-radius: 24px;
  padding: 36px 28px 28px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  position: relative;
  overflow: hidden;
  animation: popIn .45s cubic-bezier(.175,.885,.32,1.275);
}
/* Gold gradient border trick */
#popup::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 24px;
  padding: 2px;
  background: linear-gradient(135deg, #FFD700, #FF6B00, #FF3838, #FF6B00, #FFD700);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
/* Inner glow */
#popup::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,215,0,0.12) 0%, transparent 60%);
  pointer-events: none;
}
@keyframes popIn {
  from { transform: scale(.5) rotate(-5deg); opacity: 0; }
  to   { transform: scale(1)  rotate(0deg);  opacity: 1; }
}
#popup-emoji {
  font-size: 64px;
  margin-bottom: 8px;
  display: block;
  animation: bounce 0.6s ease-in-out 0.3s both;
}
@keyframes bounce {
  0%   { transform: scale(0); }
  60%  { transform: scale(1.3); }
  80%  { transform: scale(0.9); }
  100% { transform: scale(1); }
}
#popup-congrats {
  font-size: 12px;
  color: var(--gold);
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0.8;
  margin-bottom: 4px;
}
#popup-prize {
  font-size: 34px;
  font-weight: 900;
  background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.15;
  margin-bottom: 4px;
  filter: drop-shadow(0 0 15px rgba(255,180,0,0.4));
}
#popup-subtitle {
  font-size: 14px;
  color: #889;
  margin-bottom: 10px;
}
#popup-msg {
  font-size: 13px;
  color: #778;
  background: rgba(255,107,0,0.07);
  border: 1px solid rgba(255,107,0,0.15);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 14px 0;
  line-height: 1.6;
  text-align: left;
}
#popup-close {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #FF6B00, #FF8C00);
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: 1.5px;
  box-shadow: 0 6px 20px rgba(255,107,0,0.45);
  transition: opacity .2s;
}
#popup-close:hover { opacity: .9; }

/* Address Form */
#address-form {
  display: none;
  margin: 12px 0;
  gap: 8px;
  flex-direction: column;
}
#address-form.show { display: flex; }
#address-form input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid rgba(255,107,0,0.2);
  background: rgba(255,255,255,.04);
  color: #fff;
  font-size: 13px;
  outline: none;
}
#address-form input:focus { border-color: var(--orange); }

/* ── Prize list legend ──────────────────────────── */
#prize-legend {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  overflow: hidden;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
}
.legend-name {
  color: #ccc;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Footer ─────────────────────────────────────── */
#footer {
  padding: 20px;
  text-align: center;
  font-size: 11px;
  color: #334;
  border-top: 1px solid rgba(255,107,0,0.1);
  width: 100%;
  margin-top: auto;
  letter-spacing: 0.5px;
}

/* ── Responsive ──────────────────────────────────── */
@media (max-width: 380px) {
  #wheel-wrap { width: 300px; height: 300px; }
  #wheel-canvas { width: 300px; height: 300px; }
  #campaign-name { font-size: 24px; }
  #prize-legend { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<!-- Language Bar -->
<div id="lang-bar">
  <a href="/dashboard" id="back-link">← Portal</a>
  <button class="lang-btn active" onclick="setLang('zh')">中文</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>
  <button class="lang-btn" onclick="setLang('bm')">BM</button>
</div>

<!-- Header -->
<div id="header">
  <div id="header-badge">✦ VIP EXCLUSIVE ✦</div>
  <div id="campaign-name">🎰 LUCKY SPIN</div>
  <div id="campaign-subtitle" data-key="subtitle">Spin to Win Exclusive Prizes</div>
</div>

<div id="main">

  <!-- Player Bar -->
  <div id="player-bar">
    <div id="player-info">
      <div id="player-icon">🎯</div>
      <div>
        <div style="font-size:11px;color:#556;letter-spacing:1px;text-transform:uppercase">Logged in as</div>
        <div id="player-name-display"></div>
      </div>
    </div>
    <button id="logout-btn" onclick="logout()" data-key="logout">Logout</button>
  </div>

  <!-- Spin Wheel -->
  <div id="wheel-wrap">
    <div id="wheel-glow"></div>
    <div id="wheel-rim"></div>
    <!-- SVG pointer -->
    <div id="wheel-pointer">
      <svg width="36" height="44" viewBox="0 0 36 44">
        <defs>
          <linearGradient id="pgr" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFD700"/>
            <stop offset="100%" stop-color="#FF6B00"/>
          </linearGradient>
        </defs>
        <polygon points="18,0 36,38 18,30 0,38" fill="url(#pgr)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="18" cy="30" r="5" fill="#fff" opacity="0.9"/>
      </svg>
    </div>
    <canvas id="wheel-canvas" width="340" height="340"></canvas>
    <div id="wheel-center" onclick="triggerSpin()">SPIN</div>
  </div>

  <!-- Status Message -->
  <div id="status-msg"></div>

  <!-- Login Form -->
  <div id="login-form" class="sw-card">
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-size:12px;letter-spacing:2px;color:#556;text-transform:uppercase;font-weight:700">Enter Your Details</div>
    </div>
    <input class="sw-input" id="input-username" type="text" data-placeholder-key="username_placeholder" placeholder="SureWin Username" autocomplete="off">
    <input class="sw-input" id="input-code" type="text" data-placeholder-key="code_placeholder" placeholder="Redemption Code" style="text-transform:uppercase;letter-spacing:2px">
    <button class="sw-btn" id="spin-btn" onclick="handleSpin()" data-key="spin_btn">🎰 SPIN NOW</button>
    <div style="text-align:center;font-size:11px;color:#445;margin-top:6px">
      Code required · One spin per code
    </div>
  </div>

  <!-- Prize Legend (shown after prizes load) -->
  <div id="prize-legend"></div>

  <!-- Win History -->
  <div id="history-section">
    <div id="history-title" data-key="history_title">My Spin History</div>
    <div id="history-list"></div>
  </div>

</div>

<!-- Prize Popup -->
<div id="overlay">
  <div id="popup">
    <span id="popup-emoji">🎉</span>
    <div id="popup-congrats" data-key="congrats">CONGRATULATIONS!</div>
    <div id="popup-prize"></div>
    <div id="popup-subtitle"></div>
    <div id="popup-msg"></div>
    <div id="address-form">
      <input id="addr-name"    type="text" placeholder="Full Name / 姓名">
      <input id="addr-phone"   type="text" placeholder="Phone / 电话">
      <input id="addr-address" type="text" placeholder="Delivery Address / 送货地址">
    </div>
    <button id="popup-close" onclick="closePopup()" data-key="close_btn">🎊 OK, Got It!</button>
  </div>
</div>

<div id="footer">© 2026 SureWin · VIP Campaign System · All Rights Reserved</div>

// ── Background Particles ──────────────────────────────────────
(function initBgParticles() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * 1200,
      y: Math.random() * 900,
      r: Math.random() * 1.5 + 0.3,
      dx: (Math.random() - 0.5) * 0.2,
      dy: (Math.random() - 0.5) * 0.2,
      o: Math.random() * 0.5 + 0.1,
      phase: Math.random() * Math.PI * 2,
    });
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const t = Date.now() / 1000;
    particles.forEach(p => {
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      const alpha = p.o * (0.7 + 0.3 * Math.sin(t * 1.5 + p.phase));
      ctx.fillStyle = `rgba(255,215,0,${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── Rim Lights ────────────────────────────────────────────────
function buildRimLights(count = 20) {
  const rim = document.getElementById('wheel-rim');
  rim.innerHTML = '';
  const colors = ['#FFD700','#FF6B00','#FF3838','#FF80AB','#00E5FF'];
  const wrapW = 368; // wheel-wrap total + rim expansion
  const cx = wrapW / 2;
  const cy = wrapW / 2;
  const R  = wrapW / 2 - 5;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
    const x = cx + R * Math.cos(angle);
    const y = cy + R * Math.sin(angle);
    const dot = document.createElement('div');
    dot.className = 'rim-light';
    const c = colors[i % colors.length];
    dot.style.cssText = `
      left: ${x}px; top: ${y}px;
      background: ${c};
      box-shadow: 0 0 8px ${c}, 0 0 16px ${c};
      animation-delay: ${(i / count * 1.2).toFixed(2)}s;
    `;
    rim.appendChild(dot);
  }
}

// ── Draw Wheel ────────────────────────────────────────────────
function drawWheel(rotation = 0) {
  const canvas = document.getElementById('wheel-canvas');
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const cx = size / 2, cy = size / 2;
  const r  = cx - 4;
  const total = prizes.reduce((s, p) => s + (p.probability || 1), 0);
  let startAngle = rotation;

  ctx.clearRect(0, 0, size, size);

  prizes.forEach((prize, i) => {
    const slice    = ((prize.probability || 1) / total) * Math.PI * 2;
    const endAngle = startAngle + slice;
    const mid      = startAngle + slice / 2;
    const [c1, c2] = SEGMENT_COLORS[i % SEGMENT_COLORS.length];

    // Gradient fill for each segment
    const gx1 = cx + (r * 0.4) * Math.cos(mid);
    const gy1 = cy + (r * 0.4) * Math.sin(mid);
    const gx2 = cx + r * Math.cos(mid);
    const gy2 = cy + r * Math.sin(mid);
    const grad = ctx.createLinearGradient(gx1, gy1, gx2, gy2);
    grad.addColorStop(0, c1 + 'cc');
    grad.addColorStop(1, c2 + '88');

    // Segment fill
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Segment divider
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Outer arc accent
    ctx.beginPath();
    ctx.arc(cx, cy, r - 1, startAngle, endAngle);
    ctx.strokeStyle = c1;
    ctx.lineWidth = 5;
    ctx.globalAlpha = 0.6;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Prize text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mid);
    ctx.textAlign = 'right';

    // Text shadow
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 4;

    const name = prize['name_' + lang] || prize.name_en || prize.prize_value || '';
    const shortName = name.length > 10 ? name.substring(0, 9) + '…' : name;

    // Value text
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${size <= 300 ? 11 : 12}px 'Segoe UI', sans-serif`;
    ctx.fillText(shortName, r - 12, 5);

    ctx.shadowBlur = 0;
    ctx.restore();

    startAngle = endAngle;
  });

  // Outer decorative ring
  const ringGrad = ctx.createLinearGradient(0, 0, size, size);
  ringGrad.addColorStop(0, '#FFD700');
  ringGrad.addColorStop(0.33, '#FF6B00');
  ringGrad.addColorStop(0.66, '#FF3838');
  ringGrad.addColorStop(1, '#FFD700');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = ringGrad;
  ctx.lineWidth = 3;
  ctx.stroke();

  // Center disc
  const cGrad = ctx.createRadialGradient(cx - 10, cy - 10, 2, cx, cy, 35);
  cGrad.addColorStop(0, '#ffffff');
  cGrad.addColorStop(0.4, '#FFD700');
  cGrad.addColorStop(0.75, '#FF8C00');
  cGrad.addColorStop(1, '#cc4400');
  ctx.beginPath();
  ctx.arc(cx, cy, 35, 0, Math.PI * 2);
  ctx.fillStyle = cGrad;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 35, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ── Pick Winner ───────────────────────────────────────────────
function pickWinner() {
  const total = prizes.reduce((s, p) => s + (p.probability || 1), 0);
  let r = Math.random() * total;
  for (let i = 0; i < prizes.length; i++) {
    r -= prizes[i].probability || 1;
    if (r <= 0) return i;
  }
  return prizes.length - 1;
}

// ── Spin Animation ────────────────────────────────────────────
function spinToIndex(winnerIdx, onDone) {
  const total = prizes.reduce((s, p) => s + (p.probability || 1), 0);
  let sliceStart = 0;
  for (let i = 0; i < winnerIdx; i++) sliceStart += (prizes[i].probability || 1) / total * Math.PI * 2;
  const sliceMid  = sliceStart + ((prizes[winnerIdx].probability || 1) / total * Math.PI * 2) / 2;
  const targetSlice = -Math.PI / 2 - sliceMid;
  const spins = 7 + Math.random() * 4;
  const targetAngle = currentAngle - (currentAngle % (Math.PI * 2)) + Math.PI * 2 * spins + targetSlice;
  const duration = 5000 + Math.random() * 1000;
  const startTime = performance.now();
  const startAngle = currentAngle;
  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }
  function frame(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const angle = startAngle + (targetAngle - startAngle) * easeOut(progress);
    currentAngle = angle;
    drawWheel(angle);
    if (progress < 1) requestAnimationFrame(frame);
    else onDone();
  }
  requestAnimationFrame(frame);
}

// ── Confetti ──────────────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#FFD700','#FF6B00','#FF3838','#FF80AB','#00E5FF','#00C851','#651FFF','#ffffff'];
  const pieces = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: 6 + Math.random() * 8,
    h: 10 + Math.random() * 10,
    r: Math.random() * Math.PI * 2,
    dr: (Math.random() - 0.5) * 0.15,
    dx: (Math.random() - 0.5) * 3,
    dy: 2 + Math.random() * 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    alpha: 1,
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x  += p.dx; p.y += p.dy; p.r += p.dr;
      if (frame > 120) p.alpha = Math.max(0, p.alpha - 0.012);
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
      ctx.rotate(p.r);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (pieces.some(p => p.alpha > 0)) requestAnimationFrame(draw);
    else { ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.style.display = 'none'; }
  }
  draw();
}

// ── Handle Spin ───────────────────────────────────────────────
async function handleSpin() {
  const username = document.getElementById('input-username').value.trim();
  const code     = document.getElementById('input-code').value.trim().toUpperCase();
  if (!username || !code) { showMsg(t('err_fill'), 'error'); return; }
  clearMsg();
  const btn = document.getElementById('spin-btn');
  btn.disabled = true;
  btn.textContent = '⌛ Checking...';

  const { data: codes, error: codeErr } = await sb
    .from('vip_campaign_codes')
    .select('*')
    .eq('code', code)
    .eq('campaign_id', CAMPAIGN_ID)
    .single();

  if (codeErr || !codes) {
    showMsg(t('err_invalid_code'), 'error');
    btn.disabled = false; btn.textContent = t('spin_btn'); return;
  }
  if (codes.member_username && codes.member_username !== username) {
    showMsg(t('err_wrong_user'), 'error');
    btn.disabled = false; btn.textContent = t('spin_btn'); return;
  }
  if (codes.used_count >= codes.max_uses) {
    showMsg(t('err_used_up'), 'error');
    btn.disabled = false; btn.textContent = t('spin_btn'); return;
  }

  validCode = codes;
  loggedInUser = username;
  sessionStorage.setItem('sw_user', username);
  doSpin(username, codes);
}

// ── Trigger Spin (logged-in click) ───────────────────────────
async function triggerSpin() {
  if (!loggedInUser) return;
  if (spinning) return;
  const { data: availCodes } = await sb
    .from('vip_campaign_codes')
    .select('*')
    .eq('campaign_id', CAMPAIGN_ID)
    .eq('member_username', loggedInUser);
  const unused = (availCodes || []).filter(c => c.used_count < c.max_uses);
  if (unused.length === 0) {
    showMsg(lang==='zh'?'暂无可用兑换码':lang==='bm'?'Tiada kod tersedia':'No spin codes available', 'info');
    return;
  }
  validCode = unused[0];
  doSpin(loggedInUser, validCode);
}

// ── Do Spin ───────────────────────────────────────────────────
async function doSpin(username, code) {
  if (spinning) return;
  spinning = true;
  clearMsg();
  const btn = document.getElementById('spin-btn');
  if (btn) { btn.disabled = true; btn.textContent = '✨ Spinning...'; }

  const winnerIdx = pickWinner();
  const winner = prizes[winnerIdx];

  spinToIndex(winnerIdx, async () => {
    const prizeSnapshot = {
      id: winner.id,
      name_en: winner.name_en,
      name_zh: winner.name_zh,
      name_bm: winner.name_bm,
      prize_value: winner.prize_value,
      prize_type: winner.prize_type,
      turnover_multiplier: winner.turnover_multiplier
    };
    await sb.from('vip_campaign_records').insert({
      campaign_id: CAMPAIGN_ID,
      member_username: username,
      code_used: code.code,
      prize_id: winner.id || null,
      prize_snapshot: prizeSnapshot,
      status: 'pending',
      is_visible: true
    });
    await sb.from('vip_campaign_codes')
      .update({ used_count: (code.used_count || 0) + 1 })
      .eq('id', code.id);
    spinning = false;
    showPlayerState();
    loadHistory();
    launchConfetti();
    showPrizePopup(winner);
  });
}

  document.getElementById('player-name-display').textContent = loggedInUser;
  document.getElementById('history-section').classList.add('show');
}
function logout() {
  loggedInUser = null; validCode = null;
  sessionStorage.removeItem('sw_user');
  document.getElementById('login-form').style.display = 'flex';
  document.getElementById('player-bar').classList.remove('show');
  document.getElementById('history-section').classList.remove('show');
  document.getElementById('history-list').innerHTML = '';
  document.getElementById('input-username').value = '';
  document.getElementById('input-code').value = '';
  const btn = document.getElementById('spin-btn');
  if (btn) { btn.disabled = false; btn.textContent = t('spin_btn'); }
  clearMsg();
}

// ── Load History ──────────────────────────────────────────────
async function loadHistory() {
  if (!loggedInUser) return;
  const { data } = await sb
    .from('vip_campaign_records')
    .select('*')
    .eq('campaign_id', CAMPAIGN_ID)
    .eq('member_username', loggedInUser)
    .eq('is_visible', true)
    .order('created_at', { ascending: false })
    .limit(10);
  const list = document.getElementById('history-list');
  if (!data || data.length === 0) {
    list.innerHTML = `<div style="color:#445;font-size:13px;text-align:center;padding:16px">${lang==='zh'?'暂无记录':lang==='bm'?'Tiada rekod':'No spin records yet'}</div>`;
    return;
  }
  const statusMap = { pending:t('status_pending'), processing:t('status_processing'), completed:t('status_completed'), cancelled:t('status_cancelled') };
  list.innerHTML = data.map(r => {
    const snap = r.prize_snapshot || {};
    const prizeName = snap['name_'+lang] || snap.name_en || snap.prize_value || '—';
    const date = new Date(r.created_at).toLocaleDateString('en-MY', { day:'2-digit', month:'short', year:'numeric' });
    return `<div class="history-item">
      <div>
        <div class="history-prize">${prizeName}</div>
        <div class="history-date">${date}</div>
      </div>
      <span class="history-status status-${r.status}">${statusMap[r.status] || r.status}</span>
    </div>`;
  }).join('');
}

init();
</script>
