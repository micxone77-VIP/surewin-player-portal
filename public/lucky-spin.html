// ── Draw Wheel ────────────────────────────────────────────────
function drawWheel(rotation = 0) {
  const canvas = document.getElementById('wheel-canvas');
  const ctx = canvas.getContext('2d');
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r = cx - 6;
  const total = prizes.reduce((s, p) => s + (p.probability || 1), 0);
  let startAngle = rotation;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  prizes.forEach((prize, i) => {
    const slice = ((prize.probability || 1) / total) * Math.PI * 2;
    const endAngle = startAngle + slice;
    const mid = startAngle + slice / 2;

    // Slice
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    const colors = ['#0f2a48','#0d2240','#0a1e38','#0c2444'];
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = prize.color || '#FF6B00';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Coloured outer arc
    ctx.beginPath();
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.strokeStyle = prize.color || '#FF6B00';
    ctx.lineWidth = 6;
    ctx.stroke();

    // Text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mid);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Segoe UI, sans-serif';
    const name = prize['name_' + lang] || prize.name_en || prize.prize_value || '';
    const shortName = name.length > 12 ? name.substring(0, 11) + '…' : name;
    ctx.fillText(shortName, r - 10, 4);
    ctx.restore();

    startAngle = endAngle;
  });

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 28, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 28);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(0.6, '#f5c842');
  grad.addColorStop(1, '#e0a800');
  ctx.fillStyle = grad;
  ctx.fill();
}

// ── Pick Winner (weighted random) ────────────────────────────
function pickWinner() {
  const total = prizes.reduce((s, p) => s + (p.probability || 1), 0);
  let r = Math.random() * total;
  for (let i = 0; i < prizes.length; i++) {
    r -= prizes[i].probability || 1;
    if (r <= 0) return i;
  }
  return prizes.length - 1;
}

// ── Spin Animation ────────────────────────────────────────────
function spinToIndex(winnerIdx, onDone) {
  const total = prizes.reduce((s, p) => s + (p.probability || 1), 0);
  let sliceStart = 0;
  for (let i = 0; i < winnerIdx; i++) sliceStart += (prizes[i].probability || 1) / total * Math.PI * 2;
  const sliceMid = sliceStart + ((prizes[winnerIdx].probability || 1) / total * Math.PI * 2) / 2;

  // We want the pointer (top = -π/2) to point at sliceMid
  // Target rotation so that: sliceMid + rotation ≡ -π/2 (mod 2π)
  const targetSlice = -Math.PI / 2 - sliceMid;
  const spins = 6 + Math.random() * 4; // 6–10 full spins
  const targetAngle = currentAngle - (currentAngle % (Math.PI * 2)) + Math.PI * 2 * spins + targetSlice;

  const duration = 4000 + Math.random() * 1000;
  const startTime = performance.now();
  const startAngle = currentAngle;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function frame(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const angle = startAngle + (targetAngle - startAngle) * easeOut(progress);
    currentAngle = angle;
    drawWheel(angle);
    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      onDone();
    }
  }
  requestAnimationFrame(frame);
}

// ── Handle Spin (Login + Spin) ────────────────────────────────
async function handleSpin() {
  const username = document.getElementById('input-username').value.trim();
  const code     = document.getElementById('input-code').value.trim().toUpperCase();

  if (!username || !code) { showMsg(t('err_fill'), 'error'); return; }

  clearMsg();
  const btn = document.getElementById('spin-btn');
  btn.disabled = true;
  btn.textContent = '...';

  // 1. Validate code
  const { data: codes, error: codeErr } = await sb
    .from('vip_campaign_codes')
    .select('*')
    .eq('code', code)
    .eq('campaign_id', CAMPAIGN_ID)
    .single();

  if (codeErr || !codes) {
    showMsg(t('err_invalid_code'), 'error');
    btn.disabled = false; btn.textContent = t('spin_btn'); return;
  }
  if (codes.member_username && codes.member_username !== username) {
    showMsg(t('err_wrong_user'), 'error');
    btn.disabled = false; btn.textContent = t('spin_btn'); return;
  }
  if (codes.used_count >= codes.max_uses) {
    showMsg(t('err_used_up'), 'error');
    btn.disabled = false; btn.textContent = t('spin_btn'); return;
  }

  validCode = codes;
  loggedInUser = username;
  sessionStorage.setItem('sw_user', username);
  doSpin(username, codes);
}

// ── Trigger Spin (when already logged in) ────────────────────
async function triggerSpin() {
  if (!loggedInUser) return; // not logged in — ignore click on wheel
  if (spinning) return;

  // Check if player has unused codes
  const { data: availCodes } = await sb
    .from('vip_campaign_codes')
    .select('*')
    .eq('campaign_id', CAMPAIGN_ID)
    .eq('member_username', loggedInUser)
    .lt('used_count', sb.rpc ? 1 : 999); // simplify: just fetch and check

  const unused = (availCodes || []).filter(c => c.used_count < c.max_uses);
  if (unused.length === 0) {
    showMsg(lang === 'zh' ? '暂无可用兑换码' : lang === 'bm' ? 'Tiada kod tersedia' : 'No spin codes available', 'info');
    return;
  }
  validCode = unused[0];
  doSpin(loggedInUser, validCode);
}

// ── Do Spin ───────────────────────────────────────────────────
async function doSpin(username, code) {
  if (spinning) return;
  spinning = true;
  clearMsg();

  const btn = document.getElementById('spin-btn');
  if (btn) { btn.disabled = true; btn.textContent = '✨ Spinning...'; }

  // Pick winner
  const winnerIdx = pickWinner();
  const winner = prizes[winnerIdx];

  // Animate
  spinToIndex(winnerIdx, async () => {
    // Save to DB
    const prizeSnapshot = {
      id: winner.id,
      name_en: winner.name_en,
      name_zh: winner.name_zh,
      name_bm: winner.name_bm,
      prize_value: winner.prize_value,
      prize_type: winner.prize_type,
      turnover_multiplier: winner.turnover_multiplier
    };

    await sb.from('vip_campaign_records').insert({
      campaign_id: CAMPAIGN_ID,
      member_username: username,
      code_used: code.code,
      prize_id: winner.id || null,
      prize_snapshot: prizeSnapshot,
      status: 'pending',
      is_visible: true
    });

    // Update code used_count
    await sb.from('vip_campaign_codes')
      .update({ used_count: (code.used_count || 0) + 1 })
      .eq('id', code.id);

    spinning = false;
    showPlayerState();
    loadHistory();
    showPrizePopup(winner);
  });
}

// ── Show Prize Popup ──────────────────────────────────────────
function showPrizePopup(prize) {
  document.getElementById('popup-title').textContent = t('congrats');
  document.getElementById('popup-prize').textContent = prize['name_' + lang] || prize.name_en;
  document.getElementById('popup-subtitle').textContent = prize.prize_value || '';
  const msg = prize['popup_text_' + lang] || prize.popup_text_en || '';
  document.getElementById('popup-msg').textContent = msg;

  // Address form for physical prizes
  const addrForm = document.getElementById('address-form');
  if (prize.requires_address) {
    addrForm.classList.add('show');
  } else {
    addrForm.classList.remove('show');
  }

  document.getElementById('popup-close').textContent = t('close_btn');
  document.getElementById('overlay').classList.add('show');
}

function closePopup() {
  document.getElementById('overlay').classList.remove('show');
  const btn = document.getElementById('spin-btn');
  if (btn) { btn.disabled = false; btn.textContent = t('spin_btn'); }
}

// ── Player State ──────────────────────────────────────────────
function showPlayerState() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('player-bar').classList.add('show');
  document.getElementById('player-name-display').textContent = loggedInUser;
  document.getElementById('history-section').classList.add('show');
}

function logout() {
  loggedInUser = null;
  validCode = null;
  sessionStorage.removeItem('sw_user');
  document.getElementById('login-form').style.display = 'flex';
  document.getElementById('player-bar').classList.remove('show');
  document.getElementById('history-section').classList.remove('show');
  document.getElementById('history-list').innerHTML = '';
  document.getElementById('input-username').value = '';
  document.getElementById('input-code').value = '';
  const btn = document.getElementById('spin-btn');
  if (btn) { btn.disabled = false; btn.textContent = t('spin_btn'); }
  clearMsg();
}

// ── Load History ──────────────────────────────────────────────
async function loadHistory() {
  if (!loggedInUser) return;
  const { data } = await sb
    .from('vip_campaign_records')
    .select('*')
    .eq('campaign_id', CAMPAIGN_ID)
    .eq('member_username', loggedInUser)
    .eq('is_visible', true)
    .order('created_at', { ascending: false })
    .limit(10);

  const list = document.getElementById('history-list');
  if (!data || data.length === 0) {
    list.innerHTML = `<div style="color:#556;font-size:13px;text-align:center;padding:12px">${lang==='zh'?'暂无记录':lang==='bm'?'Tiada rekod':'No records yet'}</div>`;
    return;
  }

  const statusMap = { pending: t('status_pending'), processing: t('status_processing'), completed: t('status_completed'), cancelled: t('status_cancelled') };

  list.innerHTML = data.map(r => {
    const snap = r.prize_snapshot || {};
    const prizeName = snap['name_' + lang] || snap.name_en || snap.prize_value || '—';
    const date = new Date(r.created_at).toLocaleDateString('en-MY', { day:'2-digit', month:'short', year:'numeric' });
    const statusLabel = statusMap[r.status] || r.status;
    return `<div class="history-item">
      <div>
        <div class="history-prize">${prizeName}</div>
        <div class="history-date">${date}</div>
      </div>
      <span class="history-status status-${r.status}">${statusLabel}</span>
    </div>`;
  }).join('');
}

// ── Init ─────────────────────────────────────────────────────
init();
</script>
