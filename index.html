<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0C0B1D" />
    <meta name="description" content="SureWin VIP Member Portal" />
    <title>SureWin VIP Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Design tokens ─────────────────────────────────────────────── */
      :root {
        /* Backgrounds — dark purple-navy */
        --bg:        #0C0B1D;
        --surface:   #10102A;
        --surface2:  #141330;
        --card:      #141330;
        --card2:     #1A1940;

        /* Borders */
        --border:    rgba(232,160,32,0.18);
        --border-s:  rgba(255,255,255,0.07);

        /* Text */
        --text:      #EEF0F8;
        --text-2:    #7A80A8;
        --muted:     #7A80A8;
        --dim:       #3A3E60;

        /* Brand — Orange (SureWin leaderboard palette) */
        --gold:      #E8A020;
        --gold-2:    #FFB940;
        --gold-dim:  rgba(232,160,32,0.14);
        --gold-glow: rgba(232,160,32,0.28);

        /* Semantic */
        --success:   #28D888;
        --success-bg:rgba(40,216,136,.12);
        --warn:      #F59820;
        --warn-bg:   rgba(245,152,32,.12);
        --danger:    #F04848;
        --danger-bg: rgba(240,72,72,.12);
        --info:      #60A8E0;
        --info-bg:   rgba(96,168,224,.12);

        /* Tier colours */
        --tier-diamond:  #60A8E0;
        --tier-platinum: #C8D8E8;
        --tier-gold:     #E8C060;
        --tier-silver:   #94a3b8;
        --tier-bronze:   #cd7f32;
        --tier-black:    #e5e7eb;

        /* Radius & spacing */
        --r:  8px;
        --rl: 14px;
        --rx: 20px;

        /* Bottom-nav safe area */
        --nav-height: 64px;

        font-size: 16px;
      }

      /* Minimal reset */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { height: 100%; }
      body {
        font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100%;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      #root { min-height: 100vh; }
      img, svg { display: block; max-width: 100%; }
      button { font-family: inherit; cursor: pointer; border: none; background: none; }
      a { color: inherit; text-decoration: none; }
      input, textarea, select { font-family: inherit; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--surface); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

      /* Selection */
      ::selection { background: var(--gold-dim); color: var(--gold-2); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
